<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SFC Game Testing</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        padding: 30px 15px;
    }

    .container {
        max-width: 850px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .game-list {
        background: #1c1c1c;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #333;
    }

    .game {
        padding: 18px;
        border-bottom: 1px solid #333;
        transition: background 0.2s;
    }

    .game:last-child {
        border-bottom: none;
    }

    .game:hover {
        background: #282828;
    }

    .game-header {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .game input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
        flex-shrink: 0;
    }

    .game a {
        color: white;
        text-decoration: none;
        font-size: 17px;
        flex: 1;
    }

    .game a:hover {
        text-decoration: underline;
    }

    .game.completed .game-header a {
        color: #888;
        text-decoration: line-through;
    }

    .mini-notes {
        margin-top: 12px;
        width: 100%;
        min-height: 65px;
        resize: vertical;
        background: #111;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px;
        font-family: Arial, sans-serif;
    }

    .mini-notes-label {
        display: block;
        margin-top: 14px;
        font-size: 14px;
        color: #aaa;
    }

    .notes-section,
    .export-section {
        margin-top: 25px;
        background: #1c1c1c;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
    }

    h2 {
        margin-top: 0;
        font-size: 20px;
    }

    .optional {
        color: #999;
        font-size: 14px;
        font-weight: normal;
    }

    #finalNotes,
    input[type="text"] {
        width: 100%;
        background: #111;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 12px;
        margin-top: 10px;
    }

    #finalNotes {
        min-height: 140px;
        resize: vertical;
        font-family: Arial, sans-serif;
    }

    #exportCode,
    #importCode {
        font-family: monospace;
    }

    button {
        margin-top: 10px;
        padding: 11px 18px;
        border: none;
        border-radius: 8px;
        background: #4caf50;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        filter: brightness(1.1);
    }

    .import-button {
        background: #2196f3;
    }

    .status {
        display: block;
        margin-top: 10px;
        color: #aaa;
        min-height: 20px;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>SFC Game Testing</h1>

    <div class="game-list" id="gameList"></div>

    <div class="notes-section">
        <h2>
            Final Notes
            <span class="optional">(Optional)</span>
        </h2>

        <textarea
            id="finalNotes"
            placeholder="Write your final optional notes here..."
        ></textarea>
    </div>

    <div class="export-section">
        <h2>Export Code</h2>

        <input
            type="text"
            id="exportCode"
            readonly
            placeholder="Your export code will appear here..."
        >

        <button id="exportButton">
            Generate & Copy Export Code
        </button>

        <span class="status" id="exportStatus"></span>
    </div>

    <div class="export-section">
        <h2>Import Code</h2>

        <input
            type="text"
            id="importCode"
            placeholder="Paste an export code here..."
        >

        <button class="import-button" id="importButton">
            Import Code
        </button>

        <span class="status" id="importStatus"></span>
    </div>

</div>


<script>

const games = [
    {
        name: "papas-pancake",
        url: "https://schoolflashcards5.github.io/papas-pancake/"
    },
    {
        name: "ducklife4",
        url: "https://schoolflashcards5.github.io/ducklife4/"
    },
    {
        name: "papas-sushi",
        url: "https://schoolflashcards5.github.io/papas-sushi/"
    },
    {
        name: "papas-scoop",
        url: "https://schoolflashcards5.github.io/papas-scoop/"
    },
    {
        name: "papas-bake",
        url: "https://schoolflashcards5.github.io/papas-bake/"
    },
    {
        name: "papas-wing",
        url: "https://schoolflashcards5.github.io/papas-wing/"
    },
    {
        name: "papas-pasta",
        url: "https://schoolflashcards5.github.io/papas-pasta/"
    },
    {
        name: "papas-hotdog",
        url: "https://schoolflashcards5.github.io/papas-hotdog/"
    },
    {
        name: "papas-cupcake",
        url: "https://schoolflashcards5.github.io/papas-cupcake/"
    },
    {
        name: "papas-cheese",
        url: "https://schoolflashcards5.github.io/papas-cheese/"
    },
    {
        name: "ducklife-3",
        url: "https://schoolflashcards5.github.io/ducklife-3/"
    },
    {
        name: "stair-race-3d",
        url: "https://schoolflashcards5.github.io/stair-race-3d/"
    },
    {
        name: "papaspizzaria",
        url: "https://schoolflashcards5.github.io/papaspizzaria/"
    },
    {
        name: "papasburgeria",
        url: "https://schoolflashcards5.github.io/papasburgeria/"
    },
    {
        name: "papas-taco",
        url: "https://schoolflashcards5.github.io/papas-taco/"
    },
    {
        name: "papas-freeze",
        url: "https://schoolflashcards5.github.io/papas-freeze/"
    },
    {
        name: "papas-donut",
        url: "https://schoolflashcards5.github.io/papas-donut/"
    },
    {
        name: "idle-mining",
        url: "https://schoolflashcards5.github.io/idle-mining/"
    },
    {
        name: "ducklife-2",
        url: "https://schoolflashcards5.github.io/ducklife-2/"
    },
    {
        name: "ducklife",
        url: "https://schoolflashcards5.github.io/ducklife/"
    }
];


const STORAGE_KEY = "sfcGameTestingData";


let savedData = {
    checked: [],
    finalNotes: "",
    gameNotes: {}
};


function loadData() {

    try {

        const stored = localStorage.getItem(STORAGE_KEY);

        if (stored) {
            savedData = JSON.parse(stored);
        }

        if (!Array.isArray(savedData.checked)) {
            savedData.checked = [];
        }

        if (typeof savedData.finalNotes !== "string") {
            savedData.finalNotes = "";
        }

        if (
            !savedData.gameNotes ||
            typeof savedData.gameNotes !== "object"
        ) {
            savedData.gameNotes = {};
        }

    } catch (error) {

        console.error(
            "Could not load saved data:",
            error
        );

    }

}


function saveData() {

    const checked = [];
    const gameNotes = {};


    document
        .querySelectorAll(".game-checkbox")
        .forEach((checkbox) => {

            if (checkbox.checked) {
                checked.push(checkbox.dataset.game);
            }

        });


    document
        .querySelectorAll(".mini-notes")
        .forEach((textarea) => {

            gameNotes[textarea.dataset.game] =
                textarea.value;

        });


    savedData = {
        checked: checked,
        finalNotes:
            document.getElementById("finalNotes").value,
        gameNotes: gameNotes
    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(savedData)
    );

}


function renderGames() {

    const gameList =
        document.getElementById("gameList");


    gameList.innerHTML = "";


    games.forEach((game) => {

        const gameRow =
            document.createElement("div");

        gameRow.className = "game";


        const gameHeader =
            document.createElement("div");

        gameHeader.className = "game-header";


        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.className = "game-checkbox";
        checkbox.dataset.game = game.name;

        checkbox.checked =
            savedData.checked.includes(game.name);


        if (checkbox.checked) {
            gameRow.classList.add("completed");
        }


        checkbox.addEventListener("change", () => {

            gameRow.classList.toggle(
                "completed",
                checkbox.checked
            );

            saveData();

        });


        const link =
            document.createElement("a");

        link.href = game.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        link.textContent = game.name;


        const miniNotesLabel =
            document.createElement("label");

        miniNotesLabel.className =
            "mini-notes-label";

        miniNotesLabel.textContent =
            "Mini Notes (Optional)";


        const miniNotes =
            document.createElement("textarea");

        miniNotes.className = "mini-notes";

        miniNotes.dataset.game = game.name;

        miniNotes.placeholder =
            "Write optional notes for this game...";

        miniNotes.value =
            savedData.gameNotes[game.name] || "";


        miniNotes.addEventListener("input", () => {
            saveData();
        });


        gameHeader.appendChild(checkbox);
        gameHeader.appendChild(link);

        gameRow.appendChild(gameHeader);
        gameRow.appendChild(miniNotesLabel);
        gameRow.appendChild(miniNotes);

        gameList.appendChild(gameRow);

    });

}


document
    .getElementById("finalNotes")
    .addEventListener("input", () => {

        saveData();

    });


document
    .getElementById("exportButton")
    .addEventListener("click", async () => {

        saveData();


        const exportData = {
            checked: savedData.checked,
            finalNotes: savedData.finalNotes,
            gameNotes: savedData.gameNotes
        };


        const code = btoa(
            unescape(
                encodeURIComponent(
                    JSON.stringify(exportData)
                )
            )
        );


        document
            .getElementById("exportCode")
            .value = code;


        try {

            await navigator.clipboard.writeText(code);

            document
                .getElementById("exportStatus")
                .textContent =
                    "Export code copied to clipboard!";

        } catch (error) {

            document
                .getElementById("exportStatus")
                .textContent =
                    "Export code generated. Copy it manually.";

        }

    });


document
    .getElementById("importButton")
    .addEventListener("click", () => {

        const code = document
            .getElementById("importCode")
            .value
            .trim();


        const status =
            document.getElementById("importStatus");


        if (!code) {

            status.textContent =
                "Please paste an export code first.";

            return;

        }


        try {

            const importedData = JSON.parse(

                decodeURIComponent(

                    escape(

                        atob(code)

                    )

                )

            );


            if (
                !importedData ||
                !Array.isArray(importedData.checked)
            ) {
                throw new Error("Invalid data");
            }


            const validCheckedGames =
                importedData.checked.filter(
                    (gameName) =>

                        games.some(
                            (game) =>
                                game.name === gameName
                        )

                );


            const validGameNotes = {};


            if (
                importedData.gameNotes &&
                typeof importedData.gameNotes === "object"
            ) {

                games.forEach((game) => {

                    if (
                        typeof importedData.gameNotes[
                            game.name
                        ] === "string"
                    ) {

                        validGameNotes[game.name] =
                            importedData.gameNotes[
                                game.name
                            ];

                    }

                });

            }


            savedData = {
                checked: validCheckedGames,

                finalNotes:
                    typeof importedData.finalNotes === "string"
                        ? importedData.finalNotes
                        : "",

                gameNotes: validGameNotes
            };


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(savedData)
            );


            document
                .getElementById("finalNotes")
                .value =
                    savedData.finalNotes;


            renderGames();


            status.textContent =
                "Import successful! Games, mini notes, and final notes were restored.";


        } catch (error) {

            console.error(error);

            status.textContent =
                "Invalid import code.";

        }

    });


loadData();


document
    .getElementById("finalNotes")
    .value =
        savedData.finalNotes;


renderGames();

</script>

</body>
</html>
